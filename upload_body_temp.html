<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-chakra">☸</div>
        <div class="loading-text">Generating Timetables...</div>
    </div>
    
    <div class="container">
        <a href="index.html" class="back-button" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">← Back to Main Menu</a>
        
        <!-- Server Status Indicator -->
        <div class="server-status" id="serverStatusIndicator"></div>
        
        <div class="upload-container">
            <div class="page-header">
                <h1 class="page-title">Upload Course Data</h1>
                <p class="page-subtitle">Upload files to generate timetables</p>
            </div>
            
            <div class="upload-path">
                <!-- SVG Path Line (drawn dynamically via JS) -->
                <div class="path-line">
                    <svg class="path-svg" id="pathSvg">
                        <path id="curvePath" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="3" stroke-dasharray="8,4"/>
                    </svg>
                </div>
                
                <!-- Chakra that moves along path -->
                <div class="chakra" id="movingChakra">☸</div>
                
                <!-- Path Points -->
                <div class="path-point" id="point-0" data-step="0">
                    <div class="point-marker"></div>
                    <div class="point-label">Select Semester</div>
                </div>
                
                <div class="path-point" id="point-1" data-step="1">
                    <div class="point-marker"></div>
                    <div class="point-label">CSE Courses</div>
                </div>
                
                <div class="path-point" id="point-2" data-step="2">
                    <div class="point-marker"></div>
                    <div class="point-label">ECE Courses</div>
                </div>
                
                <div class="path-point" id="point-3" data-step="3">
                    <div class="point-marker"></div>
                    <div class="point-label">DSAI Courses</div>
                </div>
                
                <div class="path-point" id="point-4" data-step="4">
                    <div class="point-marker"></div>
                    <div class="point-label">Classrooms</div>
                </div>
                
                <div class="path-point" id="point-5" data-step="5">
                    <div class="point-label">Electives (Optional)</div>
                    <div class="point-marker"></div>
                </div>
                
                <div class="path-point" id="point-6" data-step="6">
                    <div class="point-marker"></div>
                    <div class="point-label">Minors (Optional)</div>
                </div>
                
                <div class="path-point" id="point-7" data-step="7">
                    <div class="point-marker"></div>
                    <div class="point-label">Generate</div>
                </div>
            </div>
        </div>
        
        <!-- Upload Panel (shows when user clicks a point) -->
        <div class="upload-panel" id="uploadPanel">
            <div class="panel-header">
                <h2 class="panel-title" id="panelTitle">Upload File</h2>
                <p class="panel-description" id="panelDescription">Select a file to upload</p>
            </div>
            <div id="panelContent"></div>
        </div>
    </div>
