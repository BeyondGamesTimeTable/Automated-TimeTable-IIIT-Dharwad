<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timetable Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .config-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .form-group input[type="date"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .info-box p {
            color: #555;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(86, 171, 47, 0.4);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05em;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(86, 171, 47, 0.35);
            margin-bottom: 20px;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(86, 171, 47, 0.5);
        }

        .sessions-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .session-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .session-card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        #statusMessage {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-button">🏠 Back to Main Menu</a>

        <div class="header">
            <h1>📋 Exam Timetable Configuration</h1>
            <p>Configure your exam schedule parameters</p>
        </div>

        <div class="config-card">
            <form id="examConfigForm">
                <div class="form-group">
                    <label for="startDate">📅 Exam Start Date</label>
                    <input type="date" id="startDate" name="startDate" required>
                    <div class="info-box">
                        <p>💡 Select the first day of your exam period</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="endDate">📅 Exam End Date</label>
                    <input type="date" id="endDate" name="endDate" required>
                    <div class="info-box">
                        <p>💡 Select the last day of your exam period. System will schedule exams between these dates.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>⏰ Exam Sessions</label>
                    <div class="sessions-config">
                        <div class="session-card">
                            <h4>🌅 Forenoon (FN)</h4>
                            <input type="time" id="fnStart" value="10:00" style="width: 100%; margin-bottom: 5px;">
                            <input type="time" id="fnEnd" value="13:00" style="width: 100%;">
                        </div>
                        <div class="session-card">
                            <h4>🌆 Afternoon (AN)</h4>
                            <input type="time" id="anStart" value="14:00" style="width: 100%; margin-bottom: 5px;">
                            <input type="time" id="anEnd" value="17:00" style="width: 100%;">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="excludeSaturday" checked>
                        <span>Exclude Saturdays from exam schedule</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="excludeSunday" checked>
                        <span>Exclude Sundays from exam schedule</span>
                    </label>
                </div>

                <div id="statusMessage"></div>

                <div class="button-group">
                    <button type="button" class="btn btn-primary" onclick="generateTimetable()">
                        🚀 Generate Exam Timetable
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="viewExistingTimetable()">
                        👀 View Existing Timetable
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').min = today;
        document.getElementById('endDate').min = today;

        // Update end date minimum when start date changes
        document.getElementById('startDate').addEventListener('change', function() {
            document.getElementById('endDate').min = this.value;
        });

        function validateDates() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);

            if (endDate < startDate) {
                showMessage('End date must be after start date!', 'error');
                return false;
            }

            const daysDiff = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
            if (daysDiff < 3) {
                showMessage('Exam period should be at least 3 days!', 'error');
                return false;
            }

            return true;
        }

        function showMessage(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        function generateTimetable() {
            if (!validateDates()) {
                return;
            }

            const config = {
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                fn_start: document.getElementById('fnStart').value,
                fn_end: document.getElementById('fnEnd').value,
                an_start: document.getElementById('anStart').value,
                an_end: document.getElementById('anEnd').value,
                exclude_saturday: document.getElementById('excludeSaturday').checked,
                exclude_sunday: document.getElementById('excludeSunday').checked
            };

            // Save configuration to localStorage
            localStorage.setItem('examConfig', JSON.stringify(config));

            // Save to JSON file for Python script to read
            const configBlob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(configBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exam_config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showMessage('✅ Configuration saved! Please run the Python script to generate the timetable.', 'success');

            // Show instructions
            setTimeout(() => {
                alert('📋 Next Steps:\n\n1. Configuration saved as exam_config.json\n2. Open terminal in exam_timetable folder\n3. Run: python main.py\n4. The timetable will be generated with your custom dates!');
            }, 1000);
        }

        function viewExistingTimetable() {
            window.location.href = 'outputs/exam_timetable.html';
        }

        // Load saved configuration if exists
        window.addEventListener('load', function() {
            const savedConfig = localStorage.getItem('examConfig');
            if (savedConfig) {
                const config = JSON.parse(savedConfig);
                document.getElementById('startDate').value = config.start_date;
                document.getElementById('endDate').value = config.end_date;
                document.getElementById('fnStart').value = config.fn_start;
                document.getElementById('fnEnd').value = config.fn_end;
                document.getElementById('anStart').value = config.an_start;
                document.getElementById('anEnd').value = config.an_end;
                document.getElementById('excludeSaturday').checked = config.exclude_saturday;
                document.getElementById('excludeSunday').checked = config.exclude_sunday;
            }
        });
    </script>
</body>
</html>
