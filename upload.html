<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Data - Sankalp</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Moving Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.15) 2px, transparent 2px);
            background-size: 80px 80px;
            animation: gridZoomRotate 25s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes gridZoomRotate {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.4;
            }
            25% {
                transform: translate(30px, 30px) scale(1.15) rotate(2deg);
                opacity: 0.7;
            }
            50% {
                transform: translate(50px, 50px) scale(1.25) rotate(0deg);
                opacity: 0.9;
            }
            75% {
                transform: translate(30px, 30px) scale(1.15) rotate(-2deg);
                opacity: 0.7;
            }
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.4;
            }
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid rgba(99, 102, 241, 0.3);
        }
        
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5em;
            background: linear-gradient(135deg, #a5b4fc 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(165, 180, 252, 0.5);
        }
        
        .header p {
            font-size: 1.2em;
            color: #cbd5e1;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.7) 0%, rgba(139, 92, 246, 0.7) 100%);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.85) 0%, rgba(139, 92, 246, 0.85) 100%);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.7);
        }
        
        .upload-section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5em;
            color: #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .drop-zone {
            border: 2px dashed rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 18px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .drop-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .drop-zone:hover::before {
            left: 100%;
        }
        
        .drop-zone.dragover {
            border-color: rgba(99, 102, 241, 0.8);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.01);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        
        .drop-zone-icon {
            font-size: 2.5em;
            margin-bottom: 12px;
        }
        
        .drop-zone-text {
            font-size: 1.1em;
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .drop-zone-subtext {
            font-size: 0.9em;
            color: #94a3b8;
        }
        
        .file-input {
            display: none;
        }
        
        .browse-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.7) 0%, rgba(139, 92, 246, 0.7) 100%);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.5);
            margin-top: 15px;
        }
        
        .browse-button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.85) 0%, rgba(139, 92, 246, 0.85) 100%);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.7);
        }
        
        .file-list {
            margin-top: 30px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            border-left: 5px solid;
            border-image: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa) 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .file-item:hover {
            transform: translateX(8px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-icon {
            font-size: 2em;
        }
        
        .file-details {
            display: flex;
            flex-direction: column;
        }
        
        .file-name {
            font-weight: 600;
            color: #22d3ee;
            font-size: 1.05em;
        }
        
        .file-size {
            font-size: 0.9em;
            color: #94a3b8;
        }
        
        .file-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        
        .status-ready {
            background: rgba(212, 244, 221, 0.3);
            border: 1px solid rgba(134, 239, 172, 0.5);
            color: #86efac;
        }
        
        .status-uploading {
            background: rgba(254, 243, 199, 0.3);
            border: 1px solid rgba(253, 230, 138, 0.5);
            color: #fde68a;
        }
        
        .status-success {
            background: rgba(134, 239, 172, 0.3);
            border: 1px solid rgba(74, 222, 128, 0.5);
            color: #4ade80;
        }
        
        .status-error {
            background: rgba(254, 202, 202, 0.3);
            border: 1px solid rgba(252, 165, 165, 0.5);
            color: #fca5a5;
        }
        
        .remove-button {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.7) 0%, rgba(220, 38, 38, 0.7) 100%);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .remove-button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.85) 0%, rgba(220, 38, 38, 0.85) 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
        }
        
        .upload-all-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.7) 0%, rgba(139, 92, 246, 0.7) 100%);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            width: 100%;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .upload-all-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .upload-all-button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .upload-all-button:hover {
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.85) 0%, rgba(139, 92, 246, 0.85) 100%);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.7);
        }
        
        .upload-all-button:disabled {
            background: linear-gradient(135deg, rgba(156, 163, 175, 0.5) 0%, rgba(107, 114, 128, 0.5) 100%);
            cursor: not-allowed;
            transform: none;
        }
        
        .instructions {
            background: rgba(99, 102, 241, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            border-left: 5px solid #6366f1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        
        .instructions h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: #a5b4fc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions ul {
            list-style: none;
            padding-left: 0;
        }
        
        .instructions li {
            padding: 8px 0;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions li:before {
            content: "✓";
            color: #4ade80;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideDown 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-info {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border-left: 5px solid #6366f1;
        }
        
        .alert-success {
            background: rgba(74, 222, 128, 0.15);
            color: #86efac;
            border-left: 5px solid #4ade80;
        }
        
        .alert-warning {
            background: rgba(251, 191, 36, 0.15);
            color: #fde68a;
            border-left: 5px solid #fbbf24;
        }
        
        .alert-icon {
            font-size: 1.5em;
        }
        
        /* Server Status Indicator */
        .server-status {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 40px;
            border-radius: 6px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .server-status.connected {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.6);
        }
        
        .server-status.disconnected {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
        }
        
        /* Semester Slider Toggle */
        .semester-slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .semester-option {
            flex: 1;
            text-align: center;
            transition: all 0.3s ease;
            opacity: 0.5;
        }
        
        .semester-option.active {
            opacity: 1;
            transform: scale(1.05);
        }
        
        .semester-title {
            font-weight: 700;
            font-size: 1.2em;
            color: #e2e8f0;
            margin-bottom: 5px;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .semester-subtitle {
            font-size: 0.9em;
            color: #94a3b8;
        }
        
        .toggle-track {
            position: relative;
            width: 140px;
            height: 4px;
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.4) 0%, rgba(139, 92, 246, 0.4) 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }
        
        .toggle-track:hover {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.6) 0%, rgba(139, 92, 246, 0.6) 100%);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }
        
        .toggle-wheel {
            position: absolute;
            top: 50%;
            left: -25px;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #FFD700;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 40px rgba(255, 215, 0, 0.4));
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: wheelRotate 3s linear infinite;
        }
        
        .toggle-wheel.odd {
            left: calc(100% - 25px);
        }
        
        @keyframes wheelRotate {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }
        
        /* Loading Overlay with Rotating Chakra */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .loading-chakra {
            font-size: 120px;
            color: #FFD700;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 60px rgba(255, 215, 0, 0.6));
            animation: chakraRotate 2s linear infinite;
        }
        
        @keyframes chakraRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8em;
            color: #a5b4fc;
            font-weight: 600;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes loadingPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* Path-based Upload Flow */
        .upload-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            min-height: 100vh;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 80px;
        }
        
        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5em;
            background: linear-gradient(135deg, #a5b4fc 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(165, 180, 252, 0.5);
        }
        
        .page-subtitle {
            font-size: 1.2em;
            color: #cbd5e1;
        }
        
        .upload-path {
            position: relative;
            padding: 40px 0;
            min-height: 1800px;
        }
        
        .path-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .path-svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .glowing-path {
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.9)) drop-shadow(0 0 16px rgba(139, 92, 246, 0.7)) drop-shadow(0 0 24px rgba(139, 92, 246, 0.5));
        }
        
        .path-point {
            position: absolute;
            z-index: 2;
            transition: all 0.5s ease;
        }
        
        .point-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.3);
            border: 3px solid rgba(99, 102, 241, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .path-point.active .point-marker {
            background: rgba(99, 102, 241, 0.6);
            border-color: rgba(99, 102, 241, 0.9);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.8);
            transform: scale(1.3);
        }
        
        .path-point.completed .point-marker {
            background: rgba(74, 222, 128, 0.6);
            border-color: rgba(74, 222, 128, 0.9);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
        }
        
        .point-label {
            position: absolute;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 10px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.95em;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        
        .path-point.active .point-label {
            opacity: 1;
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        
        .path-point.completed .point-label {
            opacity: 0.9;
            border-color: rgba(74, 222, 128, 0.6);
        }
        
        .chakra {
            position: absolute;
            font-size: 60px;
            color: #FFD700;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 215, 0, 0.6));
            animation: chakraRotate 3s linear infinite;
            transition: left 2s cubic-bezier(0.4, 0, 0.2, 1), top 2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        @keyframes chakraRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .upload-panel {
            position: absolute;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 85%;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            transition: all 0.3s ease;
        }
        
        .upload-panel.active {
            display: block;
            animation: panelFadeIn 0.3s ease;
        }
        
        @keyframes panelFadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .panel-header {
            margin-bottom: 25px;
        }
        
        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6em;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        
        .panel-description {
            font-size: 1em;
            color: #94a3b8;
        }
        
        .upload-zone {
            border: 1px dashed rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .upload-zone:hover::before {
            left: 100%;
        }
        
        .upload-zone:hover {
            border-color: rgba(99, 102, 241, 0.8);
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }
        
        .upload-zone.uploaded {
            border-color: rgba(74, 222, 128, 0.8);
            background: rgba(74, 222, 128, 0.08);
        }
        
        .zone-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .zone-text {
            font-size: 1em;
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .zone-subtext {
            font-size: 0.85em;
            color: #94a3b8;
        }
        
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 35px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(139, 92, 246, 0.8) 100%);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            margin-top: 20px;
            width: 100%;
        }
        
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.7);
        }
        
        .action-button:disabled {
            background: linear-gradient(135deg, rgba(156, 163, 175, 0.5) 0%, rgba(107, 114, 128, 0.5) 100%);
            cursor: not-allowed;
            transform: none;
        }
        
        .action-button.skip {
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.5) 0%, rgba(100, 116, 139, 0.5) 100%);
        }
        
        .action-button.generate {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.8) 0%, rgba(34, 197, 94, 0.8) 100%);
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.5);
        }
        
        .action-button.generate:hover {
            box-shadow: 0 12px 35px rgba(74, 222, 128, 0.7);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .drop-zone {
                padding: 40px 20px;
            }
            
            .loading-chakra {
                font-size: 80px;
            }
            
            .loading-text {
                font-size: 1.4em;
            }
            
            .page-title {
                font-size: 2em;
            }
            
            .upload-panel {
                padding: 25px;
                width: 95%;
            }
            
            .chakra {
                font-size: 40px;
            }
            
            .upload-path {
                min-height: 1200px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-chakra">☸</div>
        <div class="loading-text">Generating Timetables...</div>
    </div>
    
    <div class="container">
        <a href="index.html" class="back-button" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">← Back to Main Menu</a>
        
        <!-- Server Status Indicator -->
        <div class="server-status" id="serverStatusIndicator"></div>
        
        <div class="upload-container">
            <div class="page-header">
                <h1 class="page-title">Upload Course Data</h1>
                <p class="page-subtitle">Upload files to generate timetables</p>
            </div>
            
            <div class="upload-path">
                <!-- SVG Path Line (drawn dynamically via JS) -->
                <svg class="path-svg" id="pathSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
                    <path id="curvePath" fill="none" stroke="#a78bfa" stroke-width="0.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                </svg>
                
                <!-- Chakra that moves along path -->
                <div class="chakra" id="movingChakra">☸</div>
                
                <!-- Path Points -->
                <div class="path-point" id="point-0" data-step="0">
                    <div class="point-marker"></div>
                    <div class="point-label">Select Semester</div>
                </div>
                
                <div class="path-point" id="point-1" data-step="1">
                    <div class="point-marker"></div>
                    <div class="point-label">CSE Courses</div>
                </div>
                
                <div class="path-point" id="point-2" data-step="2">
                    <div class="point-marker"></div>
                    <div class="point-label">ECE Courses</div>
                </div>
                
                <div class="path-point" id="point-3" data-step="3">
                    <div class="point-marker"></div>
                    <div class="point-label">DSAI Courses</div>
                </div>
                
                <div class="path-point" id="point-4" data-step="4">
                    <div class="point-marker"></div>
                    <div class="point-label">Classrooms</div>
                </div>
                
                <div class="path-point" id="point-5" data-step="5">
                    <div class="point-marker"></div>
                    <div class="point-label">Electives (Optional)</div>
                </div>
                
                <div class="path-point" id="point-6" data-step="6">
                    <div class="point-marker"></div>
                    <div class="point-label">Minors (Optional)</div>
                </div>
                
                <div class="path-point" id="point-7" data-step="7">
                    <div class="point-marker"></div>
                    <div class="point-label">Upload All Files</div>
                </div>
                
                <div class="path-point" id="point-8" data-step="8">
                    <div class="point-marker"></div>
                    <div class="point-label">Generate</div>
                </div>
            </div>
        </div>
        
        <!-- Upload Panel (shows when user clicks a point) -->
        <div class="upload-panel" id="uploadPanel">
            <div class="panel-header">
                <h2 class="panel-title" id="panelTitle">Upload File</h2>
                <p class="panel-description" id="panelDescription">Select a file to upload</p>
            </div>
            <div id="panelContent"></div>
        </div>
    </div>
    
    <script>
        // Path-based Upload Flow JavaScript
        let currentStep = 0;
        let selectedFiles = {
            CSE: null,
            ECE: null,
            DSAI: null,
            Classroom: null,
            Electives: null,
            Minors: null
        };
        let currentVersion = null;
        let semesterType = 'even';

        // API base auto-detection
        const REMOTE_API = 'https://automated-timetable-iiit-dharwad.onrender.com';
        let API_BASE;
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:') {
            API_BASE = 'http://localhost:5000';
        } else {
            API_BASE = REMOTE_API;
        }

        // Path coordinates (curved path with much more vertical spacing)
        const pathCoordinates = [
            { x: 15, y: 6 },    // Step 0: Select Semester
            { x: 55, y: 16 },   // Step 1: CSE
            { x: 85, y: 26 },   // Step 2: ECE
            { x: 80, y: 36 },   // Step 3: DSAI
            { x: 60, y: 46 },   // Step 4: Classroom
            { x: 35, y: 56 },   // Step 5: Electives
            { x: 20, y: 66 },   // Step 6: Minors
            { x: 40, y: 78 },   // Step 7: Upload All
            { x: 55, y: 90 }    // Step 8: Generate
        ];

        // Initialize page
        window.addEventListener('DOMContentLoaded', () => {
            drawPath();
            positionPoints();
            updateChakraPosition(0, false);
            activateStep(0, false);
            checkServerStatus();
            // Auto-show first panel
            setTimeout(() => showPanel(0), 500);
        });

        function drawPath() {
            const svg = document.getElementById('pathSvg');
            const path = document.getElementById('curvePath');
            
            // Ensure SVG is visible
            svg.style.display = 'block';
            svg.style.zIndex = '1';
            
            // Use viewBox coordinates (0-100) with cubic bezier for smooth S-curves
            let pathData = `M ${pathCoordinates[0].x} ${pathCoordinates[0].y}`;
            
            for (let i = 1; i < pathCoordinates.length; i++) {
                const curr = pathCoordinates[i];
                const prev = pathCoordinates[i - 1];
                
                // Create S-curve with two control points for cubic bezier
                const dx = curr.x - prev.x;
                const dy = curr.y - prev.y;
                
                // First control point - extends from previous point
                const cp1x = prev.x + dx * 0.5;
                const cp1y = prev.y + dy * 0.2;
                
                // Second control point - approaches current point
                const cp2x = curr.x - dx * 0.5;
                const cp2y = curr.y - dy * 0.2;
                
                pathData += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${curr.x} ${curr.y}`;
            }
            
            path.setAttribute('d', pathData);
            path.setAttribute('stroke', '#a78bfa');
            path.setAttribute('stroke-width', '0.5');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('fill', 'none');
            path.style.filter = 'drop-shadow(0 0 3px #a78bfa) drop-shadow(0 0 6px #a78bfa)';
            
            console.log('✅ Path drawn with data:', pathData);
            console.log('✅ Path element stroke:', path.getAttribute('stroke'));
        }

        function positionPoints() {
            pathCoordinates.forEach((coord, index) => {
                const point = document.getElementById(`point-${index}`);
                if (point) {
                    point.style.left = `${coord.x}%`;
                    point.style.top = `${coord.y}%`;
                    point.style.transform = 'translate(-50%, -50%)';
                    
                    const label = point.querySelector('.point-label');
                    if (label) {
                        if (index % 2 === 0) {
                            label.style.left = '40px';
                            label.style.top = '50%';
                            label.style.transform = 'translateY(-50%)';
                        } else {
                            label.style.right = '40px';
                            label.style.top = '50%';
                            label.style.transform = 'translateY(-50%)';
                        }
                    }
                    
                    point.addEventListener('click', () => {
                        // Allow clicking any step
                        activateStep(index, true);
                        showPanel(index);
                    });
                }
            });
        }

        function updateChakraPosition(step, animate = true) {
            const chakra = document.getElementById('movingChakra');
            const coord = pathCoordinates[step];
            
            if (animate && step > 0) {
                // Smooth slow transition along the curve - 2.5 seconds
                chakra.style.transition = 'left 2.5s cubic-bezier(0.4, 0, 0.2, 1), top 2.5s cubic-bezier(0.4, 0, 0.2, 1)';
            } else {
                chakra.style.transition = 'none';
            }
            
            chakra.style.left = `${coord.x}%`;
            chakra.style.top = `${coord.y}%`;
        }

        function activateStep(step, animate = true) {
            for (let i = 0; i < pathCoordinates.length; i++) {
                const point = document.getElementById(`point-${i}`);
                if (point) {
                    point.classList.remove('active');
                    if (i < step) {
                        point.classList.add('completed');
                    } else {
                        point.classList.remove('completed');
                    }
                }
            }
            const currentPoint = document.getElementById(`point-${step}`);
            if (currentPoint) {
                currentPoint.classList.add('active');
                
                // Scroll to the step smoothly
                currentPoint.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            currentStep = step;
            updateChakraPosition(step, animate);
        }

        function moveToNextStep() {
            if (currentStep < pathCoordinates.length - 1) {
                activateStep(currentStep + 1);
                closePanel();
                setTimeout(() => showPanel(currentStep), 800);
            }
        }

        function showPanel(step) {
            const panel = document.getElementById('uploadPanel');
            const title = document.getElementById('panelTitle');
            const description = document.getElementById('panelDescription');
            const content = document.getElementById('panelContent');
            
            // Position panel near the node
            const coord = pathCoordinates[step];
            const uploadPath = document.querySelector('.upload-path');
            const pathRect = uploadPath.getBoundingClientRect();
            
            // Calculate position (offset to the right of the node)
            const leftOffset = coord.x > 50 ? -420 : 60; // Show left if node is on right side
            panel.style.left = `calc(${coord.x}% + ${leftOffset}px)`;
            panel.style.top = `${coord.y}%`;
            panel.style.transform = 'translateY(-50%)';
            
            panel.classList.add('active');
            
            const panels = {
                0: {
                    title: 'Select Semester Type',
                    description: 'Choose even or odd semester',
                    content: `
                        <div class="semester-slider-container">
                            <div class="semester-option ${semesterType === 'even' ? 'active' : ''}" id="evenLabel">
                                <div class="semester-title">Even Semester</div>
                                <div class="semester-subtitle">Sem 2, 4, 6, 8</div>
                            </div>
                            <div class="toggle-track" onclick="toggleSemester()">
                                <div class="toggle-wheel ${semesterType === 'odd' ? 'odd' : ''}" id="toggleWheel">☸</div>
                            </div>
                            <div class="semester-option ${semesterType === 'odd' ? 'active' : ''}" id="oddLabel">
                                <div class="semester-title">Odd Semester</div>
                                <div class="semester-subtitle">Sem 1, 3, 5, 7</div>
                            </div>
                        </div>
                        <button class="action-button" onclick="moveToNextStep()">Continue</button>
                    `
                },
                1: { title: 'CSE Course File', description: 'Select Computer Science course data', content: createFileUploadPanel('CSE', 'CSE.csv or CSE_course.csv') },
                2: { title: 'ECE Course File', description: 'Select Electronics course data', content: createFileUploadPanel('ECE', 'ECE.csv or ECE_course.csv') },
                3: { title: 'DSAI Course File', description: 'Select Data Science course data', content: createFileUploadPanel('DSAI', 'DSAI.csv or DSAI_course.csv') },
                4: { title: 'Classroom File', description: 'Select classroom information', content: createFileUploadPanel('Classroom', 'classrooms.csv') },
                5: { title: 'Electives (Optional)', description: 'Select electives or skip', content: createFileUploadPanel('Electives', 'electives.csv', true) },
                6: { title: 'Minors (Optional)', description: 'Select minors or skip', content: createFileUploadPanel('Minors', 'minors.csv', true) },
                7: {
                    title: 'Upload All Files',
                    description: 'Upload all selected files to server',
                    content: createUploadAllPanel()
                },
                8: {
                    title: 'Generate Timetables',
                    description: 'Create your timetables',
                    content: `
                        <div style="text-align: center; padding: 25px; background: rgba(99, 102, 241, 0.08); border-radius: 10px; margin-bottom: 15px;">
                            <p style="color: #a5b4fc; font-size: 1.1em;">Ready to generate timetables</p>
                        </div>
                        <button class="action-button generate" onclick="generateTimetables()">Generate Timetables</button>
                    `
                }
            };
            
            const panelData = panels[step];
            title.textContent = panelData.title;
            description.textContent = panelData.description;
            content.innerHTML = panelData.content;
        }

        function createFileUploadPanel(type, fileName, isOptional = false) {
            const file = selectedFiles[type];
            if (file) {
                return `
                    <div class="upload-zone uploaded">
                        <div class="zone-text" style="color: #4ade80;">File Selected</div>
                        <div class="zone-subtext">${file.name} (${formatBytes(file.size)})</div>
                    </div>
                    <button class="action-button" onclick="removeFile('${type}')">Change File</button>
                `;
            } else {
                return `
                    <div class="upload-zone" onclick="document.getElementById('file-${type}').click()">
                        <div class="zone-text">Click to select file</div>
                        <div class="zone-subtext">${fileName}</div>
                    </div>
                    <input type="file" id="file-${type}" class="file-input" accept=".csv" onchange="handleFileUpload('${type}', this.files[0])">
                    ${isOptional ? '<button class="action-button skip" onclick="moveToNextStep()">Skip</button>' : ''}
                `;
            }
        }
        
        function createUploadAllPanel() {
            const hasAllRequired = selectedFiles.CSE && selectedFiles.ECE && selectedFiles.DSAI && selectedFiles.Classroom;
            const fileCount = Object.values(selectedFiles).filter(f => f !== null).length;
            
            return `
                <div style="padding: 20px; background: rgba(99, 102, 241, 0.08); border-radius: 10px; margin-bottom: 15px;">
                    <p style="color: #cbd5e1; margin-bottom: 10px;">Files selected: ${fileCount}</p>
                    ${!hasAllRequired ? '<p style="color: #fca5a5; font-size: 0.9em;">Missing required files</p>' : ''}
                </div>
                <button class="action-button generate" onclick="uploadAllFiles()" ${!hasAllRequired ? 'disabled' : ''}>Upload All Files</button>
            `;
        }

        function handleFileUpload(type, file) {
            if (!file) return;
            if (!file.name.endsWith('.csv')) {
                alert('Please select CSV files only.');
                return;
            }
            selectedFiles[type] = file;
            showPanel(currentStep);
            setTimeout(() => moveToNextStep(), 800);
        }

        function removeFile(type) {
            selectedFiles[type] = null;
            const input = document.getElementById(`file-${type}`);
            if (input) input.value = '';
            showPanel(currentStep);
        }

        function closePanel() {
            document.getElementById('uploadPanel').classList.remove('active');
        }

        function toggleSemester() {
            semesterType = semesterType === 'even' ? 'odd' : 'even';
            showPanel(0);
        }

        async function uploadAllFiles() {
            if (!selectedFiles.CSE || !selectedFiles.ECE || !selectedFiles.DSAI || !selectedFiles.Classroom) {
                alert('Please select all required files');
                return;
            }
            
            const content = document.getElementById('panelContent');
            content.innerHTML = '<div style="text-align: center; color: #a5b4fc; padding: 30px;">Uploading files...</div>';
            
            try {
                const formData = new FormData();
                formData.append('cse_file', selectedFiles.CSE);
                formData.append('ece_file', selectedFiles.ECE);
                formData.append('dsai_file', selectedFiles.DSAI);
                formData.append('classroom_file', selectedFiles.Classroom);
                formData.append('semester_type', semesterType);
                if (selectedFiles.Electives) formData.append('electives_file', selectedFiles.Electives);
                if (selectedFiles.Minors) formData.append('minors_file', selectedFiles.Minors);
                
                const uploadResponse = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
                const uploadResult = await uploadResponse.json();
                
                if (!uploadResult.success) throw new Error(uploadResult.error || 'Upload failed');
                
                currentVersion = uploadResult.version;
                content.innerHTML = '<div style="text-align: center; color: #4ade80; padding: 30px;">Files uploaded successfully!</div>';
                
                setTimeout(() => moveToNextStep(), 1000);
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `
                    <div style="text-align: center; color: #fca5a5; padding: 25px;">
                        <p style="margin-bottom: 15px;">Error: ${error.message}</p>
                        <button class="action-button" onclick="uploadAllFiles()">Retry</button>
                    </div>
                `;
            }
        }
        
        async function generateTimetables() {
            if (!currentVersion) {
                alert('Please upload files first');
                return;
            }
            
            const content = document.getElementById('panelContent');
            content.innerHTML = '<div style="text-align: center; color: #a5b4fc; padding: 30px;">Generating timetables...</div>';
            document.getElementById('loadingOverlay').classList.add('active');
            
            try {
                const generateResponse = await fetch(`${API_BASE}/api/regenerate`, { method: 'POST' });
                const generateResult = await generateResponse.json();
                
                if (generateResult.success) {
                    document.getElementById('loadingOverlay').classList.remove('active');
                    closePanel();
                    alert('Timetables generated successfully! Opening results...');
                    if (generateResult.index_url) window.open(generateResult.index_url, '_blank');
                    setTimeout(() => {
                        if (confirm('Upload again?')) location.reload();
                    }, 2000);
                } else {
                    throw new Error(generateResult.error || 'Generation failed');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingOverlay').classList.remove('active');
                content.innerHTML = `
                    <div style="text-align: center; color: #fca5a5; padding: 25px;">
                        <p style="margin-bottom: 15px;">Error: ${error.message}</p>
                        <button class="action-button" onclick="generateTimetables()">Retry</button>
                    </div>
                `;
            }
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
        }

        async function checkServerStatus() {
            const indicator = document.getElementById('serverStatusIndicator');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                if (data.status === 'healthy') indicator.className = 'server-status connected';
            } catch (error) {
                indicator.className = 'server-status disconnected';
            }
        }
    </script>
</body>
